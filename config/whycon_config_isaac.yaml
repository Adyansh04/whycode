# WhyCon System Configuration File
# Isaac Sim bags (whycode_sim): tuned on whycode_1lap against ground truth

# ==============================================================================
# SYSTEM CONFIGURATION
# ==============================================================================
system:
  targets: 6                   # Number of markers to track
  frame_id: "whycon"           # Frame ID for published poses
  world_frame_id: "world"      # World frame ID
  process_rate_hz: 30.0        # Processing rate in Hz

# ==============================================================================
# DETECTOR PARAMETERS
# ==============================================================================
detector:
  # Size constraints
  min_size: 10                 # Minimum marker size in pixels
  max_size: 10000000              # Maximum marker size in pixels
  
  # Geometric tolerances
  center_distance_tolerance_ratio: 0.05   # Center distance tolerance (ratio). 0.01 rejects large off-axis markers
  center_distance_tolerance_abs: 2.0      # Center distance tolerance (absolute)
  roundness_tolerance: 0.35               # Roundness tolerance
  circularity_tolerance: 0.15            # Circularity tolerance. The outline fit is exact, true markers sit within ~0.1
  ratio_tolerance: 0.4                    # Black/white area ratio tolerance. Measured 0.76-1.11 of expected; rejects thin rings
  max_eccentricity: 0.9                   # Maximum eccentricity
  
  # Marker physical dimensions (meters)
  inner_diameter: 0.1024      # Inner diameter (m) giving WhyCode's measured black/white area ratio; printed centre 0.12
  outer_diameter: 0.20        # Outer diameter of marker (0.108) (0.206) (loop bag: 0.146)  (big Markers: 0.252)
  image_gamma: 2.2            # Encoding gamma of the image (sRGB ~2.2, linear 1.0); the edge threshold sits halfway in linear light
  full_scan_interval: 1       # Frames between whole-image searches (1 = every frame); between them only known markers are searched, near their last position

# ==============================================================================
# IDENTIFICATION PARAMETERS
# ==============================================================================
identification:
  enabled: true                # Enable ID detection
  id_bits: 6                   # Number of ID bits
  id_samples: 720              # Number of samples for ID detection
  hamming_distance: 1          # Hamming distance for error correction
  
  # Quality thresholds for reliable detection
  diameter_ratio_correction: 0.52   # ID sampling radius / outer radius; the teeth span 0.34-0.60
  ambiguity_noise_px: 0.3           # Edge noise of the code (px): turns each frame's cue into log-odds for the two pose solutions
  min_marker_pixels: 75             # Min outer segment pixels to decode an id (~9 px marker); below 75, 1-5% of reads pass the Manchester check wrong

  
# ==============================================================================
# TRACKING PARAMETERS
# ==============================================================================
tracking:
  max_association_dist: 40.0  # Max distance (px) for a new track's first match; markers move up to 37 px/frame in turns. Established tracks use the Kalman gate
  max_unseen_frames: 10       # Number of frames a track can be lost before being removed
  id_switch_threshold: 5      # Num of consecutive different ID detections needed to switch the locked ID.
  pose_alpha: 1.0             # Smoothing factor for pose (XYZ). Smaller is smoother but has more lag. Range: 0.0-1.0. 1.0 = off
  min_track_age: 2            # Frames a track must exist before it is published. Clutter tracks mostly live 1 frame
  

# ==============================================================================
# ROS INTERFACE PARAMETERS
# ==============================================================================
ros_interface:
  # Publishing options
  publish_poses: true                   # Publish pose array
  publish_images: true                  # Publish processed images
  publish_tf: true                      # Publish TF transforms
  publish_debug_images: false           # Publish consolidated debug images
  publish_visualization_markers: false  # Publish visualization markers

  # TF Parameters
  tf_frame_prefix: "whycode_"         # Prefix for TF frames
  parent_frame_id: "camera_link"      # Parent frame for TF Transforms


  # Input parameters
  input_queue_size: 30        # Input image queue size. 30 rides out DDS stalls, so a replay keeps every frame
  input_reliable: true        # Reliable image QoS: true for bags and Isaac, false for best-effort cameras
  image_encoding: "rgb8"      # Expected image encoding (rgb8, bgr8, rgba8, bgra8 or mono8). MUST match the camera stream.
  
  # Topic names
  image_input_topic:  "/camera/image_raw"
  poses_output_topic: "/whycon/poses"
  image_output_topic: "/whycon/image_out"
  debug_images_topic: "/whycon/debug_images"
  visualization_markers_topic: "/whycon/visualization_markers"

  # Service names
  detection_enabled_service_name:  "set_detection_enabled"  # Service name to enable/disable detection

# ==============================================================================
# CAMERA PARAMETERS 
# ==============================================================================
camera:

  # Camera intrinsics file configuration 
  package_name: "whycode_vision"     # Package containing camera config
  config_path: "config/camera_intrinsics_sim.yaml" # Relative path (to package) to camera config file 

  # Image dimensions
  image_width: 1280
  image_height: 720
