# IceOryx Configuration for Vision Drivers
# Optimized for RGB and Depth image streaming
# NOTE: mempools MUST be ordered by increasing chunk size

[general]
version = 1

[user]
id = 0  # Root user ID (container)

[[segment]]
# Increase total segment size to accommodate more large chunks
size = "128M"  # total segment size (adjust if needed)

# Memory pools ordered by increasing size
[[segment.mempool]]
size = 32
count = 10000

[[segment.mempool]]
size = 128
count = 10000

[[segment.mempool]]
size = 1024
count = 5000

[[segment.mempool]]
size = 4096
count = 2000

[[segment.mempool]]
size = 16384   # 16 KB
count = 1000

[[segment.mempool]]
size = 65536   # 64 KB
count = 500

[[segment.mempool]]
size = 131072  # 128 KB
count = 200

[[segment.mempool]]
size = 524288  # 512 KB
count = 200

# 1 MiB pool — increased count to avoid exhaustion when publishing large frames
[[segment.mempool]]
size = 1048576 # 1 MB
count = 1000

# 4 MiB pool — increased count for larger payloads (e.g. compressed or multi-buffer)
[[segment.mempool]]
size = 4194304 # 4 MB
count = 100

# 8 MiB pool
[[segment.mempool]]
size = 8388608 # 8 MB
count = 40

# 16 MiB pool
[[segment.mempool]]
size = 16777216 # 16 MB
count = 10