<circle cx="70.0" cy="167.0" r="4.4" class="ring"/><circle cx="70.0" cy="167.0" r="2.0" class="code"/>
<text class="lab" x="60" y="148" text-anchor="end">0.20</text>
<text class="lab" x="60" y="171" text-anchor="end">0.146</text>
<line x1="77.7" y1="156" x2="284.3" y2="156" class="path"/>
<path d="M277.3,152 L284.3,156 L277.3,160" class="arrow"/>
<path class="fov" d="M114.5,156.0 L71.6,186.2 A52.51555555555555,52.51555555555555 0 0 1 71.6,125.8 Z"/>
<g transform="translate(122.5,156.0) rotate(0.0)"><rect x="-9.0" y="-6.3" width="18.0" height="12.6" rx="3" class="robot"/><path d="M1.8,-3 L6.8,0 L1.8,3 Z" class="nose"/></g>
<text class="tick" x="284.3" y="146" text-anchor="end">41.5 m</text>
<text class="cap" x="28" y="276">A rear D435 camera keeps two markers, 0.20</text>
<text class="cap" x="28" y="290">and 0.146 m, on its axis as the robot drives</text>
<text class="cap" x="28" y="304">straight away; 640x480, 1280x720, 1920x1080.</text>
