<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="The benchmark scenes, seen from above">
<title>The benchmark's scenes in Isaac Sim, from above</title>
<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da;
          --box:#f6f8fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#58a6ff;
            --box:#161b22; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica,
         Arial, sans-serif; fill: var(--fg); }
  .ttl { font-size: 17px; font-weight: 700; } .h { font-size: 12.5px; font-weight: 650; }
  .cap { font-size: 11px; fill: var(--muted); } .tick { font-size: 9.5px; fill: var(--muted); }
  .lab { font-size: 10px; font-weight: 600; }
  .box { fill: var(--box); stroke: var(--line); }
  .ring { fill: none; stroke: var(--fg); stroke-width: 2.6; }
  .code { fill: none; stroke: var(--fg); stroke-width: 1; stroke-dasharray: 1.6 1.2; }
  .path { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 4 3; }
  .arrow { fill: none; stroke: var(--muted); stroke-width: 1.4; }
  .axis { stroke: var(--muted); stroke-width: 1; }
  .robot { fill: var(--accent); } .nose { fill: var(--bg); }
  .fov { fill: var(--accent); fill-opacity: 0.14; stroke: var(--accent); stroke-opacity: 0.5; }
  .plate { stroke: var(--fg); stroke-width: 4; stroke-linecap: round; }
  .normal { stroke: var(--fg); stroke-width: 1.2; }
  .sight { stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 2; }
  .angle { fill: none; stroke: var(--fg); stroke-width: 1.2; }
  .racks { fill: var(--line); fill-opacity: 0.6; }
</style>
<rect x="0.5" y="0.5" width="959" height="329" rx="12" fill="var(--bg)" stroke="var(--line)"/>
<text class="ttl" x="28" y="32">How the benchmark measures, in Isaac Sim</text>
<rect x="28" y="64" width="288" height="190" rx="10" class="box"/>
<text class="h" x="28" y="54">Range: driving away</text>
<line x1="70" y1="208" x2="294" y2="208" class="axis"/>
<line x1="70.0" y1="205" x2="70.0" y2="211" class="axis"/>
<text class="tick" x="70.0" y="223" text-anchor="middle">0 m</text>
<line x1="119.8" y1="205" x2="119.8" y2="211" class="axis"/>
<text class="tick" x="119.8" y="223" text-anchor="middle">10 m</text>
<line x1="169.6" y1="205" x2="169.6" y2="211" class="axis"/>
<text class="tick" x="169.6" y="223" text-anchor="middle">20 m</text>
