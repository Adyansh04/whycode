<line x1="480.0" y1="159.0" x2="480.0" y2="129.0" class="normal"/>
<path class="fov" d="M510.6,115.3 L510.7,180.6 A65.33333333333334,65.33333333333334 0 0 1 449.1,137.5 Z"/>
<g transform="translate(510.6,115.3) rotate(35.0)"><rect x="-9.0" y="-6.3" width="18.0" height="12.6" rx="3" class="robot"/><path d="M1.8,-3 L6.8,0 L1.8,3 Z" class="nose"/></g>
<line x1="480.0" y1="159.0" x2="510.6" y2="115.3" class="sight"/>
<path d="M480.0,141.0 A18,18 0 0 1 490.3,144.3" class="angle"/>
<text class="lab" x="474.0" y="137.0" text-anchor="end">incidence</text>
<text class="cap" x="336" y="276">The robot circles one 0.20 m marker at</text>
<text class="cap" x="336" y="290">2, 4 and 6 m with a side camera:</text>
<text class="cap" x="336" y="304">the incidence sweeps head-on to edge-on.</text>
<rect x="644" y="64" width="288" height="190" rx="10" class="box"/>
<text class="h" x="644" y="54">Warehouse loop</text>
