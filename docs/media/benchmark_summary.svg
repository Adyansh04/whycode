<text class="tick" x="664.0" y="462" text-anchor="middle">0 ms</text>
<line class="grid" x1="724.0" y1="140" x2="724.0" y2="448"/>
<text class="tick" x="724.0" y="462" text-anchor="middle">10 ms</text>
<line class="grid" x1="784.0" y1="140" x2="784.0" y2="448"/>
<text class="tick" x="784.0" y="462" text-anchor="middle">20 ms</text>
<rect x="268" y="120" width="14" height="8" rx="1.5" fill="var(--fg)"/>
<text class="tick" x="287" y="128">0.20 m marker</text>
