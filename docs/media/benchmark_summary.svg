<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Benchmark summary: detection range and CPU per frame per detector">
<title>WhyCode and AprilTag detectors: range and CPU</title>
<style>
:root { --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --whycode:#1a7f37; --whycon:#0969da; --apriltag:#bc4c00; --apriltag_full:#cf222e; --isaac_apriltag:#8250df; --aruco:#6e7781; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --whycode:#3fb950; --whycon:#58a6ff; --apriltag:#db6d28; --apriltag_full:#f85149; --isaac_apriltag:#a371f7; --aruco:#8b949e; } }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--fg); }
.ttl { font-size: 19px; font-weight: 700; }
.sub, .note, .val2, .tick, .cap { fill: var(--muted); }
.sub { font-size: 11.5px; } .note, .tick { font-size: 10px; }
.h { font-size: 13px; font-weight: 650; } .lab { font-size: 12.5px; font-weight: 600; }
.val { font-size: 11.5px; font-weight: 650; } .val2, .cap { font-size: 10.5px; }
.big { font-size: 26px; font-weight: 750; }
.grid { stroke: var(--line); stroke-width: 1; } .axis { stroke: var(--muted); }
.gly-s { fill: none; stroke: var(--fg); stroke-width: 3.6; }
.gly-d { fill: none; stroke: var(--fg); stroke-width: 1.4; stroke-dasharray: 2 1.6; }
.gly-f { fill: var(--fg); } .gly-b { fill: var(--bg); }
</style>
<rect x="0.5" y="0.5" width="959" height="599" rx="12" fill="var(--bg)" stroke="var(--line)"/>
<text class="ttl" x="28" y="40">WhyCode against AprilTag, in Isaac Sim</text>
<text class="sub" x="28" y="60">RealSense D435 colour camera at 1280x720. A marker's size is the black ring's diameter or the tag's black square, so a tag of the same size</text>
<text class="sub" x="28" y="75">has 27% more black. Range: found, with the right ID, in 90% of frames out to there; the dashed line runs on to where half are still found.</text>
<text class="h" x="268" y="112">How far it finds the marker</text>
<text class="h" x="664" y="112">CPU per frame</text>
<line class="grid" x1="268.0" y1="140" x2="268.0" y2="448"/>
<text class="tick" x="268.0" y="462" text-anchor="middle">0 m</text>
