<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="The detector's CPU per frame before and after the optimisation">
<title>whycode_vision: CPU per frame, 4.7x lower</title>
<style>
:root { --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#1a7f37;
        --detector:#2da44e; --image:#218bff; --transport:#d4a72c; --rest:#8c959f; --gone:#d0d7de; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#3fb950;
          --detector:#2ea043; --image:#388bfd; --transport:#bb8009; --rest:#6e7681; --gone:#30363d; }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial,
       sans-serif; fill: var(--fg); }
.ttl { font-size: 18px; font-weight: 700; } .sub { font-size: 11.5px; fill: var(--muted); }
.h { font-size: 13px; font-weight: 650; } .lab { font-size: 11.5px; }
.val { font-size: 11.5px; font-weight: 650; } .tick, .cap, .lg { font-size: 10.5px; fill: var(--muted); }
.big { font-size: 24px; font-weight: 750; fill: var(--accent); }
</style>
<rect x="0.5" y="0.5" width="959" height="499" rx="12" fill="var(--bg)" stroke="var(--line)"/>
<text class="ttl" x="28" y="38">The detector's CPU per frame, 4.7× lower</text>
<text class="sub" x="28" y="58">The detector process replaying the 1280x720 warehouse lap: CPU time per frame, every thread, measured after each optimisation step.</text>
<text class="h" x="28" y="86">How it came down</text>
<text class="lab" x="28" y="116">Before the CPU work</text>
<rect x="28" y="121" width="300.0" height="8" rx="2" fill="var(--accent)"/>
<text class="val" x="336.0" y="129">5.89 ms<tspan class="tick"></tspan></text>
<text class="lab" x="28" y="146">Scanline flood fill, exact integer moments</text>
<rect x="28" y="151" width="79.2" height="8" rx="2" fill="var(--accent)"/>
<rect x="107.2" y="151" width="220.8" height="8" rx="2" fill="var(--gone)"/>
<text class="val" x="336.0" y="159">1.55 ms<tspan class="tick">  −4.33 ms</tspan></text>
<text class="lab" x="28" y="176">Frame read in place, no 2.7 MB copy</text>
<rect x="28" y="181" width="75.1" height="8" rx="2" fill="var(--accent)"/>
<rect x="103.1" y="181" width="4.1" height="8" rx="2" fill="var(--gone)"/>
<text class="val" x="115.2" y="189">1.47 ms<tspan class="tick">  −0.08 ms</tspan></text>
<text class="lab" x="28" y="206">Grey means on demand, whole-word rows, per-word binarisation</text>
<rect x="28" y="211" width="68.2" height="8" rx="2" fill="var(--accent)"/>
<rect x="96.2" y="211" width="6.9" height="8" rx="2" fill="var(--gone)"/>
<text class="val" x="111.1" y="219">1.34 ms<tspan class="tick">  −0.14 ms</tspan></text>
<text class="lab" x="28" y="236">Frame released after the callback</text>
<rect x="28" y="241" width="63.8" height="8" rx="2" fill="var(--accent)"/>
<rect x="91.8" y="241" width="4.4" height="8" rx="2" fill="var(--gone)"/>
<text class="val" x="104.2" y="249">1.25 ms<tspan class="tick">  −0.09 ms</tspan></text>
<text class="h" x="520" y="86">Where a frame's CPU goes</text>
<text class="lab" x="520" y="114">Before, 5.4 ms a frame (profile)</text>
<rect x="520.0" y="122" width="309.8" height="22" rx="3" fill="var(--detector)"/>
<text class="val" x="525.0" y="137" fill="#ffffff">78%</text>
<rect x="830.8" y="122" width="15.8" height="22" rx="3" fill="var(--image)"/>
<rect x="847.6" y="122" width="65.4" height="22" rx="3" fill="var(--transport)"/>
<text class="val" x="852.6" y="137" fill="#ffffff">17%</text>
<rect x="914.0" y="122" width="5.0" height="22" rx="3" fill="var(--rest)"/>
<text class="lab" x="520" y="178">After, 1.1 ms a frame (profile)</text>
<rect x="520.0" y="186" width="17.1" height="22" rx="3" fill="var(--detector)"/>
<rect x="538.1" y="186" width="12.9" height="22" rx="3" fill="var(--image)"/>
<rect x="552.0" y="186" width="43.5" height="22" rx="3" fill="var(--transport)"/>
<text class="val" x="557.0" y="201" fill="#ffffff">55%</text>
<rect x="596.5" y="186" width="4.0" height="22" rx="3" fill="var(--rest)"/>
<rect x="520" y="245" width="11" height="11" rx="2" fill="var(--detector)"/>
<text class="lg" x="537" y="254">finding rings, pose, IDs, tracking: <tspan class="val">78% → 22%</tspan></text>
<rect x="520" y="263" width="11" height="11" rx="2" fill="var(--image)"/>
<text class="lg" x="537" y="272">image preparation: grey, binarisation: <tspan class="val">4% → 17%</tspan></text>
<rect x="520" y="281" width="11" height="11" rx="2" fill="var(--transport)"/>
<text class="lg" x="537" y="290">ROS 2 and DDS bringing the image in: <tspan class="val">17% → 55%</tspan></text>
<rect x="520" y="299" width="11" height="11" rx="2" fill="var(--rest)"/>
<text class="lg" x="537" y="308">kernel and the rest: <tspan class="val">2% → 6%</tspan></text>
<text class="cap" x="520" y="328">After the work the detector is a fifth of the frame; most of the rest is</text>
<text class="cap" x="520" y="343">ROS 2 moving the 2.7 MB image, which composition removes.</text>
<rect x="28.0" y="378" width="212.5" height="100" rx="10" fill="none" stroke="var(--line)"/>
<text class="big" x="44.0" y="418">4.7×</text>
<text class="cap" x="44.0" y="444">less CPU per frame,</text>
<text class="cap" x="44.0" y="460">5.89 ms down to 1.25 ms</text>
<rect x="258.5" y="378" width="212.5" height="100" rx="10" fill="none" stroke="var(--line)"/>
<text class="big" x="274.5" y="418">18.6×</text>
<text class="cap" x="274.5" y="444">faster detection core alone,</text>
<text class="cap" x="274.5" y="460">4.95 ms down to 0.27 ms</text>
<rect x="489.0" y="378" width="212.5" height="100" rx="10" fill="none" stroke="var(--line)"/>
<text class="big" x="505.0" y="418">−47%</text>
<text class="cap" x="505.0" y="444">more in one process with the</text>
<text class="cap" x="505.0" y="460">camera driver (composition)</text>
<rect x="719.5" y="378" width="212.5" height="100" rx="10" fill="none" stroke="var(--line)"/>
<text class="big" x="735.5" y="418">Same</text>
<text class="cap" x="735.5" y="444">detections, IDs and false positives</text>
<text class="cap" x="735.5" y="460">on all four loop bags</text>
</svg>
